<!doctype html>
<html lang="en" data-theme="terminal">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dhan-Claude Trader{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/plotly.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  {% set p = request.url.path %}
  <nav class="sidebar">
    <div class="brand">Dhan-Claude</div>
    <a href="/" class="{{ 'active' if p == '/' else '' }}">Dashboard</a>
    <a href="/live" class="{{ 'active' if p.startswith('/live') else '' }}">Live Market</a>
    <a href="/reports" class="{{ 'active' if p.startswith('/reports') else '' }}">Reports</a>
    <a href="/screener" class="{{ 'active' if p.startswith('/screener') else '' }}">Screener</a>
    <a href="/backtest" class="{{ 'active' if p.startswith('/backtest') else '' }}">Backtest</a>
    <a href="/options" class="{{ 'active' if p.startswith('/options') else '' }}">Options</a>
    <a href="/btst" class="{{ 'active' if p.startswith('/btst') else '' }}">BTST</a>
    <a href="/settings" class="{{ 'active' if p.startswith('/settings') else '' }}">Settings</a>
    <a href="/golive" class="{{ 'active' if p.startswith('/golive') else '' }}">Go-Live</a>
    <div class="spacer"></div>
    <button class="theme-toggle" type="button" onclick="toggleTheme()">
      <span id="theme-icon">◐</span> <span id="theme-label">Theme</span>
    </button>
  </nav>
  <main class="content">
    {% block halt_banner %}{% endblock %}
    {% block body %}{% endblock %}
  </main>
</body>
</html>
